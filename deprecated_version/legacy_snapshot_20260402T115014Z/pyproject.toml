[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "event-state-forecasting"
version = "0.1.0"
description = "Blueprint-first codebase for EOD multimodal event-state forecasting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Project Author", email = "author@example.com" }
]
keywords = [
    "finance",
    "forecasting",
    "multimodal",
    "nlp",
    "time-series",
    "event-state",
    "pytorch"
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "lxml>=5.0",
    "requests>=2.32",
    "yfinance>=0.2",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "pydantic>=2.7",
    "tqdm>=4.66",
    "python-dateutil>=2.9",
    "pytz>=2024.1",
    "exchange-calendars>=4.5",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "torch>=2.3",
    "torchmetrics>=1.4",
    "transformers>=4.43",
    "tokenizers>=0.19",
    "sentence-transformers>=3.0",
    "ta>=0.11"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "seaborn>=0.13"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
